services:
  db:
    container_name: ownned_local_container
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: local_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5501:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres -d local_db"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - /var/lib/postgresql/ownned_data
    networks:
      - ownned_dev
networks:
  ownned_dev:
