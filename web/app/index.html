<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="preload"
            href="/fonts/inter-variable.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <title>app</title>
        <script>
            ;(() => {
                let theme
                try {
                    const stored = localStorage.getItem('owned.theme')
                    theme =
                        stored === 'light' || stored === 'dark' ? stored : null
                } catch {
                    theme = null
                }
                if (!theme) {
                    theme = window.matchMedia?.('(prefers-color-scheme: dark)')
                        .matches
                        ? 'dark'
                        : 'light'
                }
                document.documentElement.dataset.theme = theme

                let palette
                try {
                    const stored = localStorage.getItem('owned.palette')
                    palette = [
                        'obsidian',
                        'carbon',
                        'graphite',
                        'slate',
                        'warm',
                        'aurora'
                    ].includes(stored)
                        ? stored
                        : 'obsidian'
                } catch {
                    palette = 'obsidian'
                }
                document.documentElement.dataset.palette = palette
            })()
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
